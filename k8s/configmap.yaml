apiVersion: v1
kind: ConfigMap
metadata:
  name: gtech-api-config
data:
  NODE_ENV: "production"
  API_PORT: "4000"
  JWT_SECRET: "demo-jwt-secret-replace-in-production-64chars-minimum-aaaa"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_SECRET: "demo-jwt-refresh-secret-replace-in-production-bbbb"
  JWT_REFRESH_EXPIRES_IN: "7d"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gtechglobal_os"
  REDIS_URL: "redis://localhost:6379"
  WEB_URL: "http://localhost:3000"
  API_URL: "http://localhost:4000"
  GWASH_API_URL: "https://api.gwash.ng"
  S3_ENDPOINT: "http://localhost:9000"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
  S3_BUCKET: "gtechglobal-docs"
