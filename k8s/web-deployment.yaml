apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtech-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gtech-web
  template:
    metadata:
      labels:
        app: gtech-web
    spec:
      containers:
      - name: gtech-web
        image: gtechacr2026.azurecr.io/gtech-web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://74.179.211.139"
---
apiVersion: v1
kind: Service
metadata:
  name: gtech-web-service
spec:
  selector:
    app: gtech-web
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
